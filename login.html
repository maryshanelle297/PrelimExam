<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --card: rgba(15, 23, 42, 0.8);
        --soft: #e2e8f0;
        --muted: #94a3b8;
        --primary: #38bdf8;
        --primary-dark: #0284c7;
        --border: rgba(148, 163, 184, 0.25);
        --input: rgba(15, 23, 42, 0.45);
        --shadow: rgba(15, 23, 42, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--soft);
      }

      .login-container {
        width: min(92vw, 430px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 25px 50px var(--shadow);
        padding: 32px 28px;
        backdrop-filter: blur(10px);
      }

      .brand {
        text-align: center;
        margin-bottom: 24px;
      }

      .brand-badge {
        width: 62px;
        height: 62px;
        margin: 0 auto 14px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      .subtitle {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.92rem;
        color: var(--soft);
      }

      input {
        width: 100%;
        padding: 14px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--input);
        color: var(--soft);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
      }

      .options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .remember input {
        width: auto;
        accent-color: var(--primary);
      }

      .forgot {
        color: var(--primary);
        text-decoration: none;
      }

      .forgot:hover {
        text-decoration: underline;
      }

      button {
        margin-top: 8px;
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 24px rgba(2, 132, 199, 0.35);
      }

      .signup {
        text-align: center;
        margin-top: 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .signup a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      .signup a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="login-container">
      <div class="brand">
        <div class="brand-badge">L</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue to your account</p>
      </div>

      <form>
        <label>
          Email address
          <input type="email" placeholder="you@example.com" required />
        </label>

        <label>
          Password
          <input type="password" placeholder="Enter your password" required />
        </label>

        <div class="options">
          <label class="remember">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>

          <a class="forgot" href="#">Forgot password?</a>
        </div>

        <button type="submit">Log In</button>
      </form>

      <p class="signup">
        Don’t have an account?
        <a href="#">Create one</a>
      </p>
    </main>
  </body>
</html>
